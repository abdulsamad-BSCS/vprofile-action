name: "BProfile Action"

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops
  EKS_CLUSTER: vprofile-eks

jobs:

  vprofile:
    name: "vProfile CI"
    runs-on: ubuntu-latest
    env:
      SONAR_URL: ${{ secrets.SONAR_URL || 'https://sonarcloud.io' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:

      # 1. Checkout source code (full history is required by Sonar)
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 11
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 3. Maven Test
      - name: Maven Test
        run: mvn -B test

      # 4. Checkstyle: generate a report only (does NOT fail the build).
      #    'checkstyle:check' fails on the strict default sun_checks.xml ruleset.
      - name: Checkstyle
        run: mvn -B checkstyle:checkstyle

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: warn

      # 5. Validate Sonar secrets (fails fast with a clear message)
      - name: Validate Sonar secrets
        run: |
          missing=0
          for v in SONAR_URL SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is EMPTY or not set in this repo/environment"
              missing=1
            else
              echo "$v is set"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          case "$SONAR_URL" in
            http://*|https://*) ;;
            *) echo "::error::SONAR_URL must start with http:// or https://"; exit 1 ;;
          esac

      # 6. SonarQube analysis
      - name: SonarQube Analysis
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \
            -Dsonar.host.url="$SONAR_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml

      # 7. SonarQube Quality Gate
      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_URL }}

  build-and-push:
    name: "Build and Push Docker Image"
    needs: vprofile          # only build/push if CI passed
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      # 5. Push Docker image
      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest