name: "BProfile Action"

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops
  EKS_CLUSTER: vprofile-eks

jobs:

  vprofile:
    name: "vProfile CI"
    runs-on: ubuntu-latest
    env:
      SONAR_URL: ${{ secrets.SONAR_URL || 'https://sonarcloud.io' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:

      # 1. Checkout source code (full history is required by Sonar)
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 11
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 3. Maven Test
      - name: Maven Test
        run: mvn -B test

      # 4. Checkstyle: generate a report only (does NOT fail the build).
      #    'checkstyle:check' fails on the strict default sun_checks.xml ruleset.
      - name: Checkstyle
        run: mvn -B checkstyle:checkstyle

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: warn

      # 5. Validate Sonar secrets (fails fast with a clear message)
      - name: Validate Sonar secrets
        run: |
          missing=0
          for v in SONAR_URL SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is EMPTY or not set in this repo/environment"
              missing=1
            else
              echo "$v is set"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          case "$SONAR_URL" in
            http://*|https://*) ;;
            *) echo "::error::SONAR_URL must start with http:// or https://"; exit 1 ;;
          esac

      # 6. SonarQube analysis
      - name: SonarQube Analysis
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \
            -Dsonar.host.url="$SONAR_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml

      # 7. SonarQube Quality Gate (direct API check; prints the real response)
      - name: SonarQube Quality Gate
        timeout-minutes: 8
        run: |
          set -euo pipefail
          REPORT=target/sonar/report-task.txt
          CE_URL=$(grep '^ceTaskUrl=' "$REPORT" | cut -d= -f2-)
          echo "Waiting for Sonar background task: $CE_URL"

          ANALYSIS_ID=""
          for i in $(seq 1 40); do
            RES=$(curl -s -u "$SONAR_TOKEN:" "$CE_URL")
            TASK_STATUS=$(echo "$RES" | jq -r '.task.status // "UNKNOWN"')
            echo "Attempt $i: task status = $TASK_STATUS"
            if [ "$TASK_STATUS" = "SUCCESS" ]; then
              ANALYSIS_ID=$(echo "$RES" | jq -r '.task.analysisId')
              break
            fi
            if [ "$TASK_STATUS" = "FAILED" ] || [ "$TASK_STATUS" = "CANCELED" ]; then
              echo "::error::Sonar background task $TASK_STATUS"
              echo "$RES" | jq .
              exit 1
            fi
            sleep 10
          done

          if [ -z "$ANALYSIS_ID" ]; then
            echo "::error::Sonar analysis did not finish in time"
            exit 1
          fi

          GATE=$(curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_URL/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")
          echo "Quality gate response:"
          echo "$GATE" | jq .

          GATE_STATUS=$(echo "$GATE" | jq -r '.projectStatus.status // "UNKNOWN"')
          echo "Quality gate status: $GATE_STATUS"

          case "$GATE_STATUS" in
            OK)
              echo "Quality gate passed." ;;
            ERROR)
              echo "::error::Quality gate FAILED"
              exit 1 ;;
            *)
              echo "::warning::Quality gate status is $GATE_STATUS (not OK/ERROR); not blocking the pipeline." ;;
          esac

  build-and-push:
    name: "Build and Push Docker Image"
    needs: vprofile          # only build/push if CI passed
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      # 5. Push Docker image
      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  DeployToEKS:
    name: "Deploy to EKS with Helm"
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code (needs the helm/ folder)
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Get the ECR registry address
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Point kubectl at the EKS cluster
      - name: Get Kube config file
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      # 5. Kubernetes login to ECR (secret named regcred)
      - name: Login to ECR (Kubernetes secret)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server="$ECR_REGISTRY" \
            --docker-username=AWS \
            --docker-password="$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 6. Deploy with Helm
      - name: Deploy Helm
        uses: bitovi/github-actions-deploy-eks-helm@v1.2.8
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: ${{ env.EKS_CLUSTER }}
          chart-path: helm/vprofilecharts
          namespace: default
          values: appimage=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},apptag=${{ github.sha }}
          name: vprofile-stack